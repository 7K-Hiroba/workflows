name: Hiroba independent OCI chart CI
on:
  workflow_call:
    inputs:
      root: {type: string, default: .}
      source-sha: {type: string, default: ""}
      upload-lifecycle-evidence: {type: boolean, default: true}
    outputs:
      status: {value: "${{ jobs.result.outputs.status }}"}
permissions: {contents: read}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {charts: "${{ steps.plan.outputs.charts }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}"}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - id: plan
        run: |
          python3 .hiroba/workflows/scripts/discover-components.py --root "consumer/${{ inputs.root }}" --all > plan.json
          charts=$(jq -c '[.components[] | select(.kind == "chart") | {name,path,stackCovered}]' plan.json)
          echo "charts=$charts" >> "$GITHUB_OUTPUT"
  test:
    if: needs.plan.result == 'success' && needs.plan.outputs.charts != '[]'
    needs: [plan]
    strategy: {fail-fast: false, matrix: {chart: "${{ fromJSON(needs.plan.outputs.charts) }}"}}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}", fetch-depth: 0}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - id: tools-key
        run: echo "key=$(.hiroba/workflows/scripts/install-ci-tools.sh --cache-key kind helm kubectl ct)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: {path: .hiroba-cache, key: "hiroba-chart-${{ steps.tools-key.outputs.key }}"}
      - run: .hiroba/workflows/scripts/install-ci-tools.sh kind helm kubectl ct
      - id: paths
        env: {INPUT_ROOT: "${{ inputs.root }}"}
        run: echo "consumer-root=$(python3 -c 'import os; print(os.path.normpath(os.path.join("consumer", os.environ["INPUT_ROOT"])))')" >> "$GITHUB_OUTPUT"
      - name: Run locked chart lint and applicable kind lifecycle
        env:
          WORKFLOW_SHA: "${{ job.workflow_sha }}"
        run: .hiroba/workflows/scripts/run-chart-tests.sh --root "consumer/${{ inputs.root }}" --chart "${{ matrix.chart.path }}" --stack-covered "${{ matrix.chart.stackCovered }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.upload-lifecycle-evidence
        with:
          name: "chart-lifecycle-evidence-${{ matrix.chart.name }}"
          path: "${{ steps.paths.outputs.consumer-root }}/evidence/chart-lifecycle-${{ matrix.chart.name }}.json"
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with: {name: "chart-diagnostics-${{ matrix.chart.name }}", path: "${{ steps.paths.outputs.consumer-root }}/diagnostics", if-no-files-found: ignore}
  result:
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-latest
    outputs: {status: "${{ steps.result.outputs.status }}"}
    steps:
      - id: result
        env: {PLAN: "${{ needs.plan.result }}", TEST: "${{ needs.test.result }}"}
        run: |
          status=success
          if [[ "$PLAN" != success || "$TEST" == failure || "$TEST" == cancelled ]]; then status=failure; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [[ "$status" == success ]] || exit 1
