name: Hiroba UI extension CI
on:
  workflow_call:
    inputs:
      root: {type: string, default: .}
      source-sha: {type: string, default: ""}
    outputs:
      status: {value: "${{ jobs.result.outputs.status }}"}
permissions: {contents: read}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: {ui-path: "${{ steps.plan.outputs.ui-path }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}"}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - id: plan
        run: |
          set -euo pipefail
          python3 .hiroba/workflows/scripts/discover-components.py --root "consumer/${{ inputs.root }}" --all > plan.json
          path=$(jq -r 'first(.components[] | select(.kind == "ui") | .path) // empty' plan.json)
          [[ -n "$path" ]] || { echo "UI component is not configured" >&2; exit 2; }
          echo "ui-path=$path" >> "$GITHUB_OUTPUT"
  test:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}"}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hiroba/workflows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24, cache: npm, cache-dependency-path: "consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}/package-lock.json"}
      - name: Install without lifecycle scripts
        working-directory: consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}
        run: npm ci --include=dev --ignore-scripts
      - name: Test
        working-directory: consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}
        run: npm test -- --reporter=json --outputFile=evidence/vitest.json
      - name: Typecheck
        working-directory: consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}
        run: npm run typecheck
      - name: Lint
        working-directory: consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}
        run: npm run lint
      - name: Build canonical Module Federation remote
        working-directory: consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}
        run: npm run build
      - name: Verify complete flat OCI asset set
        run: python3 .hiroba/workflows/scripts/check-ui-bundle.py --dist "consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}/dist" --output "consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}/ui-bundle-manifest.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ui-extension-evidence
          path: |
            consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}/evidence/vitest.json
            consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}/ui-bundle-manifest.json
          if-no-files-found: ignore
          retention-days: 30
  result:
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-latest
    outputs: {status: "${{ steps.result.outputs.status }}"}
    steps:
      - id: result
        env: {PLAN: "${{ needs.plan.result }}", RESULT: "${{ needs.test.result }}"}
        run: |
          [[ "$PLAN" == success ]] || exit 1
          echo "status=$RESULT" >> "$GITHUB_OUTPUT"
          [[ "$RESULT" == success ]] || exit 1
