name: Hiroba plugin contract compatibility
on:
  workflow_call:
    inputs:
      root: {type: string, default: .}
      source-sha: {type: string, default: ""}
      mode: {type: string, default: pr}
    outputs:
      status: {value: "${{ jobs.result.outputs.status }}"}
permissions: {contents: read}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      extension-path: "${{ steps.plan.outputs.extension-path }}"
      ui-path: "${{ steps.plan.outputs.ui-path }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}"}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - id: plan
        run: |
          set -euo pipefail
          python3 .hiroba/workflows/scripts/discover-components.py --root "consumer/${{ inputs.root }}" --all > plan.json
          extension_path=$(jq -r 'first(.components[] | select(.kind == "extension") | .path) // empty' plan.json)
          ui_path=$(jq -r 'first(.components[] | select(.kind == "ui") | .path) // empty' plan.json)
          [[ -n "$extension_path" || -n "$ui_path" ]] || { echo "compat requires an extension or UI component" >&2; exit 2; }
          echo "extension-path=$extension_path" >> "$GITHUB_OUTPUT"
          echo "ui-path=$ui_path" >> "$GITHUB_OUTPUT"
  test:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}", fetch-depth: 0}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: needs.plan.outputs.extension-path != ''
        with: {go-version-file: "consumer/${{ inputs.root }}/${{ needs.plan.outputs.extension-path }}/go.mod", cache: true}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.plan.outputs.ui-path != ''
        with: {node-version: 24, cache: npm, cache-dependency-path: "consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}/package-lock.json"}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - name: Run backend stable/previous or nightly matrix
        if: needs.plan.outputs.extension-path != ''
        env: {SOURCE_SHA: "${{ inputs.source-sha || github.sha }}", GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: .hiroba/workflows/scripts/run-compat-backend.sh --root "consumer/${{ inputs.root }}" --mode "${{ inputs.mode }}" --extension-path "${{ needs.plan.outputs.extension-path }}"
      - name: Build canonical UI remote
        if: needs.plan.outputs.ui-path != ''
        working-directory: consumer/${{ inputs.root }}/${{ needs.plan.outputs.ui-path }}
        run: |
          npm ci --include=dev --ignore-scripts
          npm run build
      - name: Mount every declared slot in a real stable/edge UI host
        if: needs.plan.outputs.ui-path != ''
        env: {SOURCE_SHA: "${{ inputs.source-sha || github.sha }}", GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: .hiroba/workflows/scripts/run-compat-browser.sh --root "consumer/${{ inputs.root }}" --mode "${{ inputs.mode }}" --ui-path "${{ needs.plan.outputs.ui-path }}"
      - name: Validate source-bound fresh compatibility evidence
        if: needs.plan.outputs.extension-path != ''
        run: python3 .hiroba/workflows/scripts/check-compat-report.py --report "consumer/${{ inputs.root }}/evidence/compat-report.json" --source-sha "${{ inputs.source-sha || github.sha }}" --max-age-days 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: compatibility-evidence
          path: |
            consumer/${{ inputs.root }}/evidence
            consumer/${{ inputs.root }}/diagnostics
          if-no-files-found: ignore
          retention-days: 30
  result:
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-latest
    outputs: {status: "${{ steps.result.outputs.status }}"}
    steps:
      - id: result
        env: {PLAN: "${{ needs.plan.result }}", RESULT: "${{ needs.test.result }}"}
        run: |
          [[ "$PLAN" == success ]] || exit 1
          echo "status=$RESULT" >> "$GITHUB_OUTPUT"
          [[ "$RESULT" == success ]] || exit 1
