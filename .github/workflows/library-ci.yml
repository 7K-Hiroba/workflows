name: library CI
on: {pull_request: {branches: [main]}, push: {branches: [main]}, merge_group: {}}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, fetch-depth: 0}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: {go-version: "1.26.3", cache: false}
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: .hiroba/workflows/scripts/install-ci-tools.sh shellcheck
      - run: make -C .hiroba/workflows setup lint unit test-negative
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - name: Render and verify clean consumer
        run: |
          .hiroba/workflows/scripts/render-scaffold.sh --source .hiroba/workflows/scaffold --out "${{ runner.temp }}/rendered" --sha "${{ github.sha }}"
          python3 .hiroba/workflows/scripts/check-workflow-pins.py --root "${{ runner.temp }}/rendered" --require-rendered
          python3 .hiroba/workflows/scripts/validate-repository.py --root "${{ runner.temp }}/rendered" --registry .hiroba/workflows/tests/fixtures/app-registry.yaml
          python3 .hiroba/workflows/scripts/build-indexes.py --root "${{ runner.temp }}/rendered" --check
          python3 .hiroba/workflows/scripts/sync-release-please-config.py --root "${{ runner.temp }}/rendered" --check
          python3 .hiroba/workflows/scripts/render-observability.py --root "${{ runner.temp }}/rendered" --check
  result:
    if: always()
    needs: [test, render]
    runs-on: ubuntu-latest
    steps:
      - env: {TEST: "${{ needs.test.result }}", RENDER: "${{ needs.render.result }}"}
        run: |
          [[ "$TEST" == success && "$RENDER" == success ]] || exit 1
