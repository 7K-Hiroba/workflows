name: nightly scaffold and edge compatibility
on:
  schedule: [{cron: "23 4 * * *"}]
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  compat:
    uses: $/.github/workflows/compat-check.yml
    with: {root: scaffold, mode: nightly}
    permissions: {contents: read, actions: read}
  packages:
    uses: $/.github/workflows/test-packages.yml
    with: {root: scaffold, all: true}
  observability:
    uses: $/.github/workflows/test-observability.yml
    with: {root: scaffold}
  runtime:
    uses: $/.github/workflows/test-runtime-smoke.yml
    with: {root: scaffold, mode: local, profile: ci}
  notify:
    if: needs.compat.outputs.status == 'failure'
    needs: [compat]
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}
    steps:
      - name: Open or update one early-warning issue
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          number=$(gh issue list --state open --json number,title --jq '.[] | select(.title == "[compat] edge incompatibility") | .number' | head -n 1)
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "Edge compatibility failed again. Evidence: $RUN_URL"
          else
            gh issue create --title '[compat] edge incompatibility' --body "Backend or browser edge compatibility failed. Evidence: $RUN_URL"
          fi
  result:
    if: always()
    needs: [compat, packages, observability, runtime, notify]
    runs-on: ubuntu-latest
    steps:
      - env:
          COMPAT: "${{ needs.compat.outputs.status }}"
          PACKAGES: "${{ needs.packages.outputs.status }}"
          OBSERVABILITY: "${{ needs.observability.outputs.status }}"
          RUNTIME: "${{ needs.runtime.outputs.status }}"
        run: |
          [[ "$COMPAT" == success && "$PACKAGES" == success && "$OBSERVABILITY" == success && "$RUNTIME" == success ]] || exit 1
