name: protected CI publish rehearsal
on:
  workflow_dispatch:
    inputs:
      source_sha: {required: true, type: string}
      mode: {required: true, type: choice, options: [full, repair-chart]}
      chart: {required: false, type: string}
      version: {required: false, type: string}
permissions: {contents: read}
concurrency: {group: "hiroba-library-release-${{ github.repository }}", cancel-in-progress: false}
jobs:
  full:
    if: inputs.mode == 'full' && inputs.source_sha == github.sha
    uses: $/.github/workflows/release.yml
    with:
      root: scaffold
      rehearsal: true
      registry-prefix: ghcr.io/7k-hiroba/workflows/ci
      environment: ci-publish
    permissions: {contents: write, packages: write, id-token: write, attestations: write, actions: read}
  chartless-observability:
    if: inputs.mode == 'full' && inputs.source_sha == github.sha
    uses: $/.github/workflows/release.yml
    with: {root: tests/fixtures/chartless-observability, rehearsal: true, registry-prefix: ghcr.io/7k-hiroba/workflows/ci, environment: ci-publish}
    permissions: {contents: write, packages: write, id-token: write, attestations: write, actions: read}
  nonplugin-helm:
    if: inputs.mode == 'full' && inputs.source_sha == github.sha
    uses: $/.github/workflows/release.yml
    with: {root: tests/fixtures/non-plugin-runtime, rehearsal: true, registry-prefix: ghcr.io/7k-hiroba/workflows/ci, environment: ci-publish}
    permissions: {contents: write, packages: write, id-token: write, attestations: write, actions: read}
  chartless-manifests:
    if: inputs.mode == 'full' && inputs.source_sha == github.sha
    uses: $/.github/workflows/release.yml
    with: {root: tests/fixtures/chartless-runtime, rehearsal: true, registry-prefix: ghcr.io/7k-hiroba/workflows/ci, environment: ci-publish}
    permissions: {contents: write, packages: write, id-token: write, attestations: write, actions: read}
  artifact-manifests:
    if: inputs.mode == 'full' && inputs.source_sha == github.sha
    uses: $/.github/workflows/release.yml
    with: {root: tests/fixtures/artifact-bound-runtime, rehearsal: true, registry-prefix: ghcr.io/7k-hiroba/workflows/ci, environment: ci-publish}
    permissions: {contents: write, packages: write, id-token: write, attestations: write, actions: read}
  reuse-chart:
    if: inputs.mode == 'repair-chart' && inputs.source_sha == github.sha
    uses: $/.github/workflows/release-chart.yml
    with:
      root: scaffold
      chart: ${{ inputs.chart }}
      version: ${{ inputs.version }}
      source-sha: ${{ inputs.source_sha }}
      repair: false
      rehearsal: true
      standalone: true
      registry-prefix: ghcr.io/7k-hiroba/workflows/ci
      environment: ci-publish
      required-lanes: chart
    permissions: {contents: read, packages: write, id-token: write, attestations: write, actions: read}
  result:
    if: always()
    needs: [full, chartless-observability, nonplugin-helm, chartless-manifests, artifact-manifests, reuse-chart]
    runs-on: ubuntu-latest
    steps:
      - env:
          MODE: "${{ inputs.mode }}"
          FULL: "${{ needs.full.outputs.status }}"
          CHARTLESS_OBS: "${{ needs.chartless-observability.outputs.status }}"
          NONPLUGIN: "${{ needs.nonplugin-helm.outputs.status }}"
          CHARTLESS: "${{ needs.chartless-manifests.outputs.status }}"
          ARTIFACT: "${{ needs.artifact-manifests.outputs.status }}"
          REUSE: "${{ needs.reuse-chart.outputs.status }}"
        run: |
          if [[ "$MODE" == full ]]; then
            for status in "$FULL" "$CHARTLESS_OBS" "$NONPLUGIN" "$CHARTLESS" "$ARTIFACT"; do
              [[ "$status" == success ]] || exit 1
            done
          else
            [[ "$REUSE" == success ]] || exit 1
          fi
