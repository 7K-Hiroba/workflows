name: protected CI publish rehearsal
on:
  workflow_dispatch:
    inputs:
      source_sha: {required: true, type: string}
      mode: {required: true, type: choice, options: [full, repair-chart]}
      fixture:
        required: true
        type: choice
        default: scaffold
        options: [scaffold, chartless-observability, nonplugin-helm, chartless-manifests, artifact-manifests]
      chart: {required: false, type: string}
      version: {required: false, type: string}
permissions: {contents: read}
concurrency: {group: "hiroba-library-release-${{ github.repository }}", cancel-in-progress: false}
jobs:
  resolve:
    if: inputs.mode == 'full' && inputs.source_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: {root: "${{ steps.fixture.outputs.root }}"}
    steps:
      - id: fixture
        env: {FIXTURE: "${{ inputs.fixture }}"}
        run: |
          set -euo pipefail
          case "$FIXTURE" in
            scaffold) root=scaffold ;;
            chartless-observability) root=tests/fixtures/chartless-observability ;;
            nonplugin-helm) root=tests/fixtures/non-plugin-runtime ;;
            chartless-manifests) root=tests/fixtures/chartless-runtime ;;
            artifact-manifests) root=tests/fixtures/artifact-bound-runtime ;;
            *) echo "unsupported fixture: $FIXTURE" >&2; exit 2 ;;
          esac
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
  full:
    if: inputs.mode == 'full' && inputs.source_sha == github.sha
    needs: [resolve]
    uses: $/.github/workflows/release.yml
    with:
      root: "${{ needs.resolve.outputs.root }}"
      rehearsal: true
      registry-prefix: ghcr.io/7k-hiroba/workflows/ci
      environment: ci-publish
    permissions: {contents: write, packages: write, id-token: write, attestations: write, actions: read, artifact-metadata: write}
  reuse-chart:
    if: inputs.mode == 'repair-chart' && inputs.source_sha == github.sha
    uses: $/.github/workflows/release-chart.yml
    with:
      root: scaffold
      chart: ${{ inputs.chart }}
      version: ${{ inputs.version }}
      source-sha: ${{ inputs.source_sha }}
      repair: false
      rehearsal: true
      standalone: true
      registry-prefix: ghcr.io/7k-hiroba/workflows/ci
      environment: ci-publish
      required-lanes: chart stack-lifecycle
    permissions: {contents: read, packages: write, id-token: write, attestations: write, actions: read, artifact-metadata: write}
  result:
    if: always()
    needs: [resolve, full, reuse-chart]
    runs-on: ubuntu-latest
    steps:
      - env:
          MODE: "${{ inputs.mode }}"
          RESOLVE: "${{ needs.resolve.result }}"
          FULL: "${{ needs.full.outputs.status }}"
          REUSE: "${{ needs.reuse-chart.outputs.status }}"
        run: |
          if [[ "$MODE" == full ]]; then
            [[ "$RESOLVE" == success && "$FULL" == success ]] || exit 1
          else
            [[ "$REUSE" == success ]] || exit 1
          fi
