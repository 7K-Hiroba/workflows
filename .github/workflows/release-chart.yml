name: Hiroba trusted OCI chart release
on:
  workflow_call:
    inputs:
      root: {type: string, default: .}
      chart: {type: string, required: true}
      version: {type: string, required: true}
      source-sha: {type: string, required: true}
      repair: {type: boolean, default: false}
      rehearsal: {type: boolean, default: false}
      standalone: {type: boolean, default: false}
      registry-prefix: {type: string, default: ghcr.io/7k-hiroba}
      environment: {type: string, default: release}
      evidence-name: {type: string, default: release-test-evidence}
      required-lanes: {type: string, default: chart}
    outputs:
      status: {value: "${{ jobs.result.outputs.status }}"}
permissions: {contents: read}
jobs:
  test:
    uses: $/.github/workflows/ci-chart.yml
    with: {root: "${{ inputs.root }}", source-sha: "${{ inputs.source-sha }}"}
  publish:
    needs: [test]
    if: needs.test.outputs.status == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions: {contents: read, packages: write, id-token: write, attestations: write, actions: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}", fetch-depth: 0}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: {go-version: "1.26.3", cache: false}
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - run: .hiroba/workflows/scripts/install-ci-tools.sh crane
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: "!inputs.standalone"
        with: {name: "${{ inputs.evidence-name }}", path: evidence}
      - name: Add exact-source chart test result
        run: |
          mkdir -p evidence
          jq -n --arg sourceSha "${{ inputs.source-sha }}" '{schema:"inari.lane-result.v1",lane:"chart",status:"passed",sourceSha:$sourceSha}' > evidence/chart.json
      - name: Log in to GHCR
        env: {TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish or repair immutable chart
        id: publish
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          source_sha="${{ inputs.source-sha }}"
          release_tag="${{ inputs.chart }}-v$version"
          if [[ "${{ inputs.rehearsal }}" == true && "${{ inputs.repair }}" == true ]]; then echo "rehearsal cannot repair a git tag" >&2; exit 2; fi
          if [[ "${{ inputs.rehearsal }}" == true ]]; then
            version="$version-ci.${source_sha:0:12}"
            release_tag="ci-${source_sha:0:12}"
            python3 -c 'import sys,yaml; p=sys.argv[1]; data=yaml.safe_load(open(p)); data["version"]=sys.argv[2]; open(p,"w").write(yaml.safe_dump(data, sort_keys=False))' "consumer/${{ inputs.root }}/charts/${{ inputs.chart }}/Chart.yaml" "$version"
          fi
          app=$(python3 -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["app"])' "consumer/${{ inputs.root }}/.hiroba.yaml")
          tier=$(python3 -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["trustTier"])' "consumer/${{ inputs.root }}/.hiroba.yaml")
          output="evidence/artifact-chart-${{ inputs.chart }}.json"
          .hiroba/workflows/scripts/release-chart.sh --root "consumer/${{ inputs.root }}" \
            --chart "${{ inputs.chart }}" --version "$version" \
            --repository-base "${{ inputs.registry-prefix }}/$app/charts" --source-sha "${{ inputs.source-sha }}" \
            --repair "${{ inputs.repair }}" --output "$output"
          {
            echo "digest=$(jq -r .digest "$output")"
            echo "version=$version"
            echo "release-tag=$release_tag"
            echo "app=$app"
            echo "tier=$tier"
          } >> "$GITHUB_OUTPUT"
      - name: Sign and attach release-linked test evidence
        env:
          ARTIFACT_REPOSITORY: "${{ inputs.registry-prefix }}/${{ steps.publish.outputs.app }}/charts/${{ inputs.chart }}"
          ARTIFACT_DIGEST: "${{ steps.publish.outputs.digest }}"
          ARTIFACT_REF: "${{ inputs.registry-prefix }}/${{ steps.publish.outputs.app }}/charts/${{ inputs.chart }}@${{ steps.publish.outputs.digest }}"
          MEDIA_TYPE: application/vnd.cncf.helm.chart.v1
          APP: "${{ steps.publish.outputs.app }}"
          COMPONENT: "${{ inputs.chart }}"
          TRUST_TIER: "${{ steps.publish.outputs.tier }}"
          SOURCE_REPOSITORY: "${{ github.repository }}"
          SOURCE_SHA: "${{ inputs.source-sha }}"
          WORKFLOW_SHA: "${{ job.workflow_sha }}"
          WORKFLOW_PATH: "${{ job.workflow_file_path }}"
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          RELEASE_TAG: "${{ steps.publish.outputs.release-tag }}"
          EVIDENCE_DIR: evidence
          REQUIRED_LANES: "${{ inputs.required-lanes }}"
          PREDICATE_OUT: "evidence/test-chart-${{ inputs.chart }}.json"
        run: .hiroba/workflows/scripts/sign-and-attest.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: "${{ inputs.registry-prefix }}/${{ steps.publish.outputs.app }}/charts/${{ inputs.chart }}"
          subject-digest: "${{ steps.publish.outputs.digest }}"
          push-to-registry: true
      - name: Verify chart evidence
        env:
          ARTIFACT_REF: "${{ inputs.registry-prefix }}/${{ steps.publish.outputs.app }}/charts/${{ inputs.chart }}@${{ steps.publish.outputs.digest }}"
          ARTIFACT_REPOSITORY: "${{ inputs.registry-prefix }}/${{ steps.publish.outputs.app }}/charts/${{ inputs.chart }}"
          ARTIFACT_DIGEST: "${{ steps.publish.outputs.digest }}"
          MEDIA_TYPE: application/vnd.cncf.helm.chart.v1
          SOURCE_REPOSITORY: "${{ github.repository }}"
          SOURCE_SHA: "${{ inputs.source-sha }}"
          WORKFLOW_SHA: "${{ job.workflow_sha }}"
          REQUIRED_LANES: "${{ inputs.required-lanes }}"
          EXPECTED_PUBLISHER: "^https://github\\.com/7K-Hiroba/workflows/\\.github/workflows/release-chart\\.yml@${{ job.workflow_sha }}$"
          WORKFLOW_PATH: "${{ job.workflow_file_path }}"
          RELEASE_TAG: "${{ steps.publish.outputs.release-tag }}"
          VERIFICATION_RECEIPT: "evidence/receipt-chart-${{ inputs.chart }}.json"
        run: .hiroba/workflows/scripts/verify-release.sh
      - run: python3 .hiroba/workflows/scripts/mark-artifact-verified.py --artifact "evidence/artifact-chart-${{ inputs.chart }}.json" --receipt "evidence/receipt-chart-${{ inputs.chart }}.json" --predicate "evidence/test-chart-${{ inputs.chart }}.json"
      - name: Verify packaged chart by exact version and digest
        run: |
          helm show chart "oci://${{ inputs.registry-prefix }}/${{ steps.publish.outputs.app }}/charts/${{ inputs.chart }}" --version "${{ steps.publish.outputs.version }}" >/dev/null
          crane digest "${{ inputs.registry-prefix }}/${{ steps.publish.outputs.app }}/charts/${{ inputs.chart }}:${{ steps.publish.outputs.version }}" | grep -Fx "${{ steps.publish.outputs.digest }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: {name: "artifact-chart-${{ inputs.chart }}", path: "evidence/artifact-chart-${{ inputs.chart }}.json", retention-days: 30}
  result:
    if: always()
    needs: [test, publish]
    runs-on: ubuntu-latest
    outputs: {status: "${{ steps.result.outputs.status }}"}
    steps:
      - id: result
        env: {TEST: "${{ needs.test.outputs.status }}", PUBLISH: "${{ needs.publish.result }}"}
        run: |
          status=success
          [[ "$TEST" == success && "$PUBLISH" == success ]] || status=failure
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [[ "$status" == success ]] || exit 1
