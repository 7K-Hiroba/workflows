name: scaffold CI
on: {pull_request: {branches: [main]}, push: {branches: [main]}, merge_group: {}}
permissions: {contents: read}
jobs:
  validate:
    uses: $/.github/workflows/validate-packages.yml
    with: {root: scaffold, registry: consumer/tests/fixtures/app-registry.yaml}
  packages:
    uses: $/.github/workflows/test-packages.yml
    with: {root: scaffold, all: true}
  go:
    uses: $/.github/workflows/ci-go-extension.yml
    with: {root: scaffold}
  ui:
    uses: $/.github/workflows/ci-ui-extension.yml
    with: {root: scaffold}
  chart:
    uses: $/.github/workflows/ci-chart.yml
    with: {root: scaffold}
  observability:
    uses: $/.github/workflows/test-observability.yml
    with: {root: scaffold}
  compat:
    uses: $/.github/workflows/compat-check.yml
    with: {root: scaffold, mode: pr}
  runtime:
    uses: $/.github/workflows/test-runtime-smoke.yml
    with: {root: scaffold, mode: local, profile: ci}
  chartless-observability-validate:
    uses: $/.github/workflows/validate-packages.yml
    with: {root: tests/fixtures/chartless-observability}
  chartless-observability-packages:
    uses: $/.github/workflows/test-packages.yml
    with: {root: tests/fixtures/chartless-observability, all: true}
  chartless-observability:
    uses: $/.github/workflows/test-observability.yml
    with: {root: tests/fixtures/chartless-observability}
  nonplugin-validate:
    uses: $/.github/workflows/validate-packages.yml
    with: {root: tests/fixtures/non-plugin-runtime}
  nonplugin-chart:
    uses: $/.github/workflows/ci-chart.yml
    with: {root: tests/fixtures/non-plugin-runtime}
  nonplugin-runtime:
    uses: $/.github/workflows/test-runtime-smoke.yml
    with: {root: tests/fixtures/non-plugin-runtime, mode: local, profile: ci}
  chartless-validate:
    uses: $/.github/workflows/validate-packages.yml
    with: {root: tests/fixtures/chartless-runtime}
  chartless-runtime:
    uses: $/.github/workflows/test-runtime-smoke.yml
    with: {root: tests/fixtures/chartless-runtime, mode: local, profile: ci}
  result:
    name: scaffold-ci-result
    if: always()
    needs: [validate, packages, go, ui, chart, observability, compat, runtime, chartless-observability-validate, chartless-observability-packages, chartless-observability, nonplugin-validate, nonplugin-chart, nonplugin-runtime, chartless-validate, chartless-runtime]
    runs-on: ubuntu-latest
    steps:
      - env:
          VALIDATE: "${{ needs.validate.outputs.status }}"
          PACKAGES: "${{ needs.packages.outputs.status }}"
          GO: "${{ needs.go.outputs.status }}"
          UI: "${{ needs.ui.outputs.status }}"
          CHART: "${{ needs.chart.outputs.status }}"
          OBSERVABILITY: "${{ needs.observability.outputs.status }}"
          COMPAT: "${{ needs.compat.outputs.status }}"
          RUNTIME: "${{ needs.runtime.outputs.status }}"
          CHARTLESS_OBS_VALIDATE: "${{ needs.chartless-observability-validate.outputs.status }}"
          CHARTLESS_OBS_PACKAGES: "${{ needs.chartless-observability-packages.outputs.status }}"
          CHARTLESS_OBS: "${{ needs.chartless-observability.outputs.status }}"
          NONPLUGIN_VALIDATE: "${{ needs.nonplugin-validate.outputs.status }}"
          NONPLUGIN_CHART: "${{ needs.nonplugin-chart.outputs.status }}"
          NONPLUGIN_RUNTIME: "${{ needs.nonplugin-runtime.outputs.status }}"
          CHARTLESS_VALIDATE: "${{ needs.chartless-validate.outputs.status }}"
          CHARTLESS_RUNTIME: "${{ needs.chartless-runtime.outputs.status }}"
        run: |
          for status in "$VALIDATE" "$PACKAGES" "$GO" "$UI" "$CHART" "$OBSERVABILITY" "$COMPAT" "$RUNTIME" "$CHARTLESS_OBS_VALIDATE" "$CHARTLESS_OBS_PACKAGES" "$CHARTLESS_OBS" "$NONPLUGIN_VALIDATE" "$NONPLUGIN_CHART" "$NONPLUGIN_RUNTIME" "$CHARTLESS_VALIDATE" "$CHARTLESS_RUNTIME"; do
            [[ "$status" == success ]] || exit 1
          done
