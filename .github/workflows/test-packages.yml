name: Hiroba package type tests
on:
  workflow_call:
    inputs:
      root: {type: string, default: .}
      source-sha: {type: string, default: ""}
      all: {type: boolean, default: false}
    outputs:
      status: {value: "${{ jobs.result.outputs.status }}"}
permissions: {contents: read}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      consumer-root: ${{ steps.matrix.outputs.consumer-root }}
      kro: ${{ steps.matrix.outputs.kro }}
      policy: ${{ steps.matrix.outputs.policy }}
      app: ${{ steps.matrix.outputs.app }}
      manifests: ${{ steps.matrix.outputs.manifests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}", fetch-depth: 0}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - id: matrix
        env: {BASE: "${{ github.base_ref }}", ALL: "${{ inputs.all }}", ROOT: "${{ inputs.root }}"}
        run: |
          set -euo pipefail
          echo "consumer-root=$(python3 -c 'import os; print(os.path.normpath(os.path.join("consumer", os.environ["ROOT"])))')" >> "$GITHUB_OUTPUT"
          args=(--root "consumer/$ROOT")
          if [[ "$ALL" == true || "${GITHUB_EVENT_NAME}" != pull_request ]]; then
            args+=(--all)
          else
            git -C consumer fetch origin "$BASE" --depth=1
            git -C consumer diff --name-only "origin/$BASE" HEAD > changed.txt
            args+=(--changed-files changed.txt)
          fi
          python3 .hiroba/workflows/scripts/discover-components.py "${args[@]}" > plan.json
          jq -c '[.components[] | select(.kind == "package" and .packageType == "kro-rgd" and .stackCovered != true) | {name,path}]' plan.json > kro.json
          jq -c '[.components[] | select(.kind == "package" and .packageType == "policy-pack") | {name,path}]' plan.json > policy.json
          jq -c '[.components[] | select(.kind == "package" and .packageType == "platform-app") | {name,path}]' plan.json > app.json
          jq -c '[.components[] | select(.kind == "package" and .packageType == "manifests") | {name,path}]' plan.json > manifests.json
          {
            echo "kro=$(cat kro.json)"
            echo "policy=$(cat policy.json)"
            echo "app=$(cat app.json)"
            echo "manifests=$(cat manifests.json)"
          } >> "$GITHUB_OUTPUT"
  kro:
    if: needs.plan.outputs.kro != '[]'
    needs: [plan]
    strategy: {fail-fast: false, matrix: {package: "${{ fromJSON(needs.plan.outputs.kro) }}"}}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}"}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - id: tools-key
        run: echo "key=$(.hiroba/workflows/scripts/install-ci-tools.sh --cache-key kind helm kubectl crane)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with: {path: .hiroba-cache, key: "hiroba-package-${{ steps.tools-key.outputs.key }}"}
      - id: tools
        run: .hiroba/workflows/scripts/install-ci-tools.sh kind helm kubectl crane
      - run: .hiroba/workflows/scripts/test-packages.sh --root "consumer/${{ inputs.root }}" --type kro-rgd --package "${{ matrix.package.name }}" --package-path "${{ matrix.package.path }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with: {name: "kro-diagnostics-${{ matrix.package.name }}", path: "${{ needs.plan.outputs.consumer-root }}/diagnostics", if-no-files-found: ignore}
  policy:
    if: needs.plan.outputs.policy != '[]'
    needs: [plan]
    strategy: {fail-fast: false, matrix: {package: "${{ fromJSON(needs.plan.outputs.policy) }}"}}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}"}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - id: tools-key
        run: echo "key=$(.hiroba/workflows/scripts/install-ci-tools.sh --cache-key kind kubectl)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with: {path: .hiroba-cache, key: "hiroba-policy-${{ steps.tools-key.outputs.key }}"}
      - run: .hiroba/workflows/scripts/install-ci-tools.sh kind kubectl
      - run: .hiroba/workflows/scripts/test-packages.sh --root "consumer/${{ inputs.root }}" --type policy-pack --package "${{ matrix.package.name }}" --package-path "${{ matrix.package.path }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with: {name: "policy-diagnostics-${{ matrix.package.name }}", path: "${{ needs.plan.outputs.consumer-root }}/diagnostics", if-no-files-found: ignore}
  app:
    if: needs.plan.outputs.app != '[]'
    needs: [plan]
    strategy: {fail-fast: false, matrix: {package: "${{ fromJSON(needs.plan.outputs.app) }}"}}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}"}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - run: .hiroba/workflows/scripts/test-packages.sh --root "consumer/${{ inputs.root }}" --type platform-app --package "${{ matrix.package.name }}" --package-path "${{ matrix.package.path }}"
  manifests:
    if: needs.plan.outputs.manifests != '[]'
    needs: [plan]
    strategy: {fail-fast: false, matrix: {package: '${{ fromJSON(needs.plan.outputs.manifests) }}'}}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer, ref: "${{ inputs.source-sha }}"}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - run: .hiroba/workflows/scripts/test-packages.sh --root "consumer/${{ inputs.root }}" --type manifests --package "${{ matrix.package.name }}" --package-path "${{ matrix.package.path }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with: {name: "manifests-diagnostics-${{ matrix.package.name }}", path: '${{ needs.plan.outputs.consumer-root }}/diagnostics', if-no-files-found: ignore}
  result:
    if: always()
    needs: [plan, kro, policy, app, manifests]
    runs-on: ubuntu-latest
    outputs: {status: "${{ steps.result.outputs.status }}"}
    steps:
      - id: result
        env:
          PLAN: ${{ needs.plan.result }}
          KRO: ${{ needs.kro.result }}
          POLICY: ${{ needs.policy.result }}
          APP: ${{ needs.app.result }}
          MANIFESTS: ${{ needs.manifests.result }}
        run: |
          status=success
          if [[ "$PLAN" != success || "$KRO" == failure || "$KRO" == cancelled || "$POLICY" == failure || "$POLICY" == cancelled || "$APP" == failure || "$APP" == cancelled || "$MANIFESTS" == failure || "$MANIFESTS" == cancelled ]]; then status=failure; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [[ "$status" == success ]] || exit 1
