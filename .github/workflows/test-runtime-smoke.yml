name: Hiroba ephemeral Argo runtime smoke
on:
  workflow_call:
    inputs:
      root: {type: string, default: .}
      mode: {type: string, default: local}
      profile: {type: string, default: ci}
      app-ref: {type: string, default: ""}
      suite-ref: {type: string, default: ""}
    outputs:
      status: {value: "${{ jobs.result.outputs.status }}"}
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {path: consumer}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {repository: "${{ job.workflow_repository }}", ref: "${{ job.workflow_sha }}", path: .hiroba/workflows}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: {go-version: "1.26.3", cache: false}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2
      - name: Install pinned CI tools
        run: .hiroba/workflows/scripts/install-ci-tools.sh kind argo crane
      - name: Run ephemeral runtime smoke
        env:
          EXPECTED_PUBLISHER: "https://github.com/${{ job.workflow_repository }}/"
        run: |
          .hiroba/workflows/scripts/run-runtime-smoke.sh \
            --root "consumer/${{ inputs.root }}" --mode "${{ inputs.mode }}" --profile "${{ inputs.profile }}" \
            --app-ref "${{ inputs.app-ref }}" --suite-ref "${{ inputs.suite-ref }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: runtime-smoke-evidence
          path: |
            consumer/${{ inputs.root }}/evidence
            consumer/${{ inputs.root }}/diagnostics
          if-no-files-found: ignore
          retention-days: 30
  result:
    if: always()
    needs: [smoke]
    runs-on: ubuntu-latest
    outputs: {status: "${{ steps.result.outputs.status }}"}
    steps:
      - id: result
        env: {RESULT: "${{ needs.smoke.result }}"}
        run: |
          echo "status=$RESULT" >> "$GITHUB_OUTPUT"
          [[ "$RESULT" == success ]] || exit 1
