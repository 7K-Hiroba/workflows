apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workflows-scaffold.fullname" . }}
  labels: {{ include "workflows-scaffold.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: workflows-scaffold
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{ include "workflows-scaffold.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: extension
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: SCAFFOLD_HTTP, value: "true"}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources: {{ .Values.resources | toYaml | nindent 12 }}
