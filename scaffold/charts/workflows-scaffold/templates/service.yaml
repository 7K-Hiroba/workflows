apiVersion: v1
kind: Service
metadata:
  name: {{ include "workflows-scaffold.fullname" . }}
  labels: {{ include "workflows-scaffold.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: workflows-scaffold
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
