apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workflows-scaffold-managed
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.metadata.labels != null &&
        'app.kubernetes.io/managed-by' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'hiroba'
      message: pods must carry the Hiroba managed-by label
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: workflows-scaffold-managed
spec:
  policyName: workflows-scaffold-managed
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: {policy.test: workflows-scaffold}
