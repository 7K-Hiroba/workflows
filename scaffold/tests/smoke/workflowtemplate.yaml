apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: workflows-scaffold
  namespace: default
  labels:
    inari.dev/smoke-target: workflows-scaffold
    inari.dev/suite-schema: inari.smoke.v1
spec:
  entrypoint: smoke
  activeDeadlineSeconds: 300
  ttlStrategy:
    secondsAfterCompletion: 300
    secondsAfterFailure: 3600
  templates:
    - name: smoke
      retryStrategy:
        limit: 1
      container:
        name: smoke
        image: curlimages/curl:8.11.1@sha256:9be9b39ac2a66b98bef6d1e1e615af8ff50ec2e746b9163bc12f2bdbf14a949d
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        args:
          - >-
            curl --fail --silent --show-error --max-time 10 http://workflows-scaffold.default.svc:8080/healthz &&
            curl --fail --silent --show-error --max-time 10 http://workflows-scaffold.default.svc:8080/api/ping |
            grep -q '"status":"ok"'
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
