suiteSchema: inari.smoke.v1
target:
  id: runtime-fixture
  version: 0.1.0
  component: packages/runtime-fixture
  adapter:
    kind: manifests
    fixtureOnly: false
    artifactPath: manifests.yaml
    readiness:
    - kind: Deployment
      name: hiroba-artifact-smoke-fixture
      namespace: default
      condition: Available
executableProfiles:
- ci
- stage
- prod
compatibleAppVersions: '>=0.1.0 <2.0.0'
parameterContract: inari.smoke.params.v1
dependencies: []
timeout: 5m
profiles:
  ci:
    sideEffects: readOnly
    cleanup: required
  stage:
    sideEffects: readOnly
    cleanup: required
  prod:
    sideEffects: readOnly
    cleanup: required
rbacRequirements:
- verbs:
  - get
  - list
  resources:
  - pods
  - services
workflowTemplate: workflowtemplate.yaml
entrypoint: smoke
idempotency: safe
cleanup: no resources are created by the read-only journey
